# Mac dinh chay bang H2 trong bo nho (che do PostgreSQL) de demo va kiem thu
# khong can cai CSDL. Chay that voi PostgreSQL: --spring.profiles.active=postgres
spring:
  datasource:
    url: jdbc:h2:mem:khobanhang;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always

app:
  jwt:
    # Bi mat ky JWT lay tu bien moi truong (D02 muc 4.2). Gia tri mac dinh chi dung cho may dev.
    secret: ${APP_JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
    ttl-hours: 8
  login:
    max-failed-attempts: 5
    lock-minutes: 15

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/khobanhang}
    username: ${DB_USER:khobanhang}
    password: ${DB_PASSWORD}
